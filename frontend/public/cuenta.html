<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi cuenta · OPORTUNIIA</title><style>body{margin:0;background:#f4f3ee;color:#0b1a28;font:16px system-ui}main{max-width:1000px;margin:30px auto;padding:24px;background:white;border-radius:12px}form{max-width:440px;display:grid;gap:14px;margin:24px 0}label{display:grid;gap:6px}input,select,button{font:inherit;padding:12px;border:1px solid #ccd4d9;border-radius:6px}button{cursor:pointer}button[type=submit]{background:#047857;color:white}nav{display:flex;flex-wrap:wrap;gap:16px}a{color:#1f6588}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #ddd}.table{overflow:auto}.password{display:flex}.password input{min-width:0;flex:1}.password button{flex:none}button:disabled{opacity:.5}[hidden]{display:none!important}@media(max-width:600px){main{margin:0;padding:18px}}</style></head><body><main><p>OPORTUNIIA · MI CUENTA</p><nav><a href="/mi-oportuniia">Volver</a><a href="/cuenta/contrasena">Cambiar contraseña</a><a href="/cuenta/usuarios" id="admin-link" hidden>Gestionar usuarios</a><a href="/acceso">Acceso</a></nav><h1 id="title">Mi cuenta</h1><p id="message" role="status" aria-live="polite"></p>
<section id="users" hidden><button type="button" id="new-user">Nuevo usuario</button><div class="table"><table><thead><tr><th>Usuario</th><th>Correo</th><th>Rol</th><th>Acciones</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<form id="create" hidden><h2 id="create-title">Nuevo usuario</h2><label class="new-field">Usuario<input name="username" required maxlength="80" autocomplete="off"></label><label class="new-field">Nombre<input name="name" required maxlength="120"></label><label class="new-field">Correo de recuperación<input name="email" type="email" required></label><label class="new-field">Rol<select name="role"><option value="USER">Usuario</option><option value="ADMIN">Administrador</option></select></label><label>Contraseña inicial<span class="password"><input name="password" type="password" required minlength="12" autocomplete="new-password"><button type="button" class="eye" aria-label="Mostrar contraseña">Mostrar</button></span></label><p>Caduca en 24 horas. Deberá cambiarla al entrar.</p><button type="submit">Guardar</button><button type="button" id="cancel">Cancelar</button></form>
<form id="change" hidden><label>Contraseña actual<span class="password"><input name="current_password" type="password" required autocomplete="current-password"><button type="button" class="eye" aria-label="Mostrar contraseña">Mostrar</button></span></label><label>Nueva contraseña<span class="password"><input name="new_password" type="password" required minlength="12" autocomplete="new-password"><button type="button" class="eye" aria-label="Mostrar contraseña">Mostrar</button></span></label><label>Repite la contraseña<span class="password"><input name="confirm" type="password" required minlength="12" autocomplete="new-password"><button type="button" class="eye" aria-label="Mostrar contraseña">Mostrar</button></span></label><button type="submit">Guardar contraseña</button></form>
<form id="recovery" hidden><label class="request-field">Usuario o correo<input name="username" required autocomplete="username"></label><label class="request-field">Correo de recuperación<input name="email" type="email" required autocomplete="email"></label><label class="reset-field" hidden>Nueva contraseña<span class="password"><input name="new_password" type="password" minlength="12" autocomplete="new-password"><button type="button" class="eye" aria-label="Mostrar contraseña">Mostrar</button></span></label><button type="submit">Continuar</button></form>
<script>
const $=id=>document.getElementById(id), message=$('message');let me=null,target=null;
async function call(path,method='GET',body){const r=await fetch('/api/accounts'+path,{method,credentials:'same-origin',headers:{'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:d.detail?.message||'No se pudo completar la operación');return d;}
function status(text){message.textContent=text;}
async function busy(form,task){const b=form.querySelector('button[type=submit]');b.disabled=true;status('Procesando…');try{await task();}catch(e){status(e.message);}finally{b.disabled=false;}}
for(const b of document.querySelectorAll('.eye'))b.onclick=()=>{const i=b.parentElement.querySelector('input');const show=i.type==='password';i.type=show?'text':'password';b.textContent=show?'Ocultar':'Mostrar';b.setAttribute('aria-label',show?'Ocultar contraseña':'Mostrar contraseña');b.setAttribute('aria-pressed',String(show));};
function open(account){target=account;$('create').reset();$('create').hidden=false;$('create-title').textContent=account?'Nueva contraseña inicial':'Nuevo usuario';for(const el of document.querySelectorAll('.new-field')){el.hidden=!!account;el.querySelector('input,select').disabled=!!account;}}
$('new-user').onclick=()=>open(null);$('cancel').onclick=()=>{$('create').hidden=true;$('create').reset();};
async function load(){const users=await call('/users');$('rows').replaceChildren();for(const u of users){const row=document.createElement('tr');for(const v of [u.username,u.email,u.role]){const c=document.createElement('td');c.textContent=v;row.append(c);}const actions=document.createElement('td');if(u.id!==me.id){const initial=document.createElement('button');initial.type='button';initial.textContent='Contraseña inicial';initial.onclick=()=>open(u);actions.append(initial);const del=document.createElement('button');del.type='button';del.textContent='Eliminar';del.onclick=async()=>{if(!confirm('¿Eliminar el acceso de '+u.username+'? Sus registros se conservarán.'))return;try{await call('/users/'+encodeURIComponent(u.id),'DELETE');await load();status('Acceso eliminado');}catch(e){status(e.message);}};actions.append(del);}row.append(actions);$('rows').append(row);}}
$('create').onsubmit=e=>{e.preventDefault();busy(e.target,async()=>{const data=Object.fromEntries(new FormData(e.target));await call(target?'/users/'+encodeURIComponent(target.id)+'/password':'/users','POST',target?{password:data.password}:data);e.target.reset();e.target.hidden=true;await load();status('Guardado. El usuario deberá cambiar su contraseña inicial');});};
$('change').onsubmit=e=>{e.preventDefault();busy(e.target,async()=>{const d=Object.fromEntries(new FormData(e.target));if(d.new_password!==d.confirm)throw Error('Las contraseñas no coinciden');await call('/password','POST',{current_password:d.current_password,new_password:d.new_password});await fetch('/api/auth/logout',{method:'POST'});location.assign('/acceso');});};
const token=new URLSearchParams(location.search).get('token');$('recovery').onsubmit=e=>{e.preventDefault();busy(e.target,async()=>{const d=Object.fromEntries(new FormData(e.target));const result=await call(token?'/recovery/confirm':'/recovery/request','POST',token?{token,new_password:d.new_password}:{username:d.username,email:d.email});status(token?'Contraseña actualizada. Ya puedes entrar':result.message);e.target.reset();if(token)history.replaceState({},'', '/cuenta/recuperar');});};
(async()=>{const path=location.pathname;if(path.endsWith('/recuperar')){$('title').textContent='Recuperar contraseña';$('recovery').hidden=false;for(const el of document.querySelectorAll('.request-field')){el.hidden=!!token;el.querySelector('input').disabled=!!token;}for(const el of document.querySelectorAll('.reset-field')){el.hidden=!token;el.querySelector('input').required=!!token;}return;}try{me=await call('/me');$('admin-link').hidden=me.role!=='ADMIN';if(me.must_change_password&&!path.endsWith('/contrasena')){location.replace('/cuenta/contrasena');return;}if(path.endsWith('/usuarios')){$('title').textContent='Gestión de usuarios';if(me.role!=='ADMIN')throw Error('Solo administradores');$('users').hidden=false;await load();}else{$('title').textContent='Cambiar contraseña';$('change').hidden=false;if(me.must_change_password)status('Debes cambiar tu contraseña inicial antes de continuar');}}catch(e){status(e.message);}})();
</script></main></body></html>
