<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Usuarios · OPORTUNIIA</title><link rel="stylesheet" href="/private/app.css"><link rel="stylesheet" href="/private/account.css"></head><body class="private-dark account-page"><main><a href="/mi-oportuniia">Volver a Mi OPORTUNIIA</a><h1>Gestión de usuarios</h1><p><a class="button" href="/bandeja-equipo.html">Consultas de clientes</a></p><p id="status" role="status" aria-live="polite">Comprobando permisos…</p><section id="accounts"></section><section id="create" hidden><h2>Crear usuario</h2><form class="card form-grid"><label>Usuario<input name="username" required pattern="[a-z0-9][a-z0-9._-]{2,79}" autocomplete="off"></label><label>Nombre<input name="name" required maxlength="180"></label><label>Email de la cuenta<input name="email" type="email" required></label><label>Email de recuperación<input name="recovery_email" type="email" required></label><label>Rol<select name="role"><option value="user">Usuario estándar</option><option value="superadmin">Superadministrador</option></select></label><label>Contraseña temporal<input name="initial_password" type="password" autocomplete="new-password" required minlength="11" maxlength="72"></label><p>Caduca en 24 horas. El usuario deberá cambiarla por otra distinta al entrar.</p><button class="button primary">Crear usuario</button></form></section></main><script type="module" src="/private/accounts.js"></script></body></html>
