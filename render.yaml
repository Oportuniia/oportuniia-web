services:
  - type: web
    name: oportuniia-web-backend
    runtime: python
    branch: main
    autoDeploy: true
    region: frankfurt
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: oportuniia_web
      - key: CORS_ORIGINS
        sync: false
      - key: PRESENTATION_WEB_BASE_URL
        value: https://oportuniia-presentacion.onrender.com
      - key: WEB_PRESENTATION_M2M_KEY
        sync: false
      - key: WEB_PRESENTATION_INGEST_KEY
        sync: false
