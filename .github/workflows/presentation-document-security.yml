name: Presentation Document Security
on:
  pull_request:
    paths:
      - "backend/presentation_document_*.py"
      - "backend/catalog_data.py"
      - "backend/server.py"
      - "backend/templates/detalle.html"
      - "backend/tests/test_presentation_document_*.py"
      - "backend/tests/test_public_catalogue_privacy.py"
      - ".github/workflows/presentation-document-security.yml"
  workflow_dispatch:
jobs:
  document-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install security-test dependencies
        run: python -m pip install pytest
      - name: Run public-view, authorization and metadata-privacy tests
        env:
          PYTHONPATH: backend
        run: >-
          python -m pytest -q
          backend/tests/test_presentation_document_view.py
          backend/tests/test_presentation_document_authz.py
          backend/tests/test_public_catalogue_privacy.py
