name: M2M MASTER Contract Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/m2m_master_contract.py"
      - "backend/tests/test_m2m_master_contract.py"
      - "docs/contracts/**"
      - "docs/M2M_TRANSPORT_MASTER_v1.md"
      - ".github/workflows/m2m-master-contract-gate.yml"
  push:
    branches:
      - "sandbox/m2m-master-aligned-v1-20261004"

jobs:
  m2m-master-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run isolated M2M MASTER contract checks
        run: |
          python - <<'PY'
          from backend.m2m_master_contract import (
              M2MContractError,
              build_ack,
              build_event,
              payload_hash,
              retry_offset_seconds,
              validate_ack,
              validate_event,
          )

          assert payload_hash({"b": 2, "a": 1}) == payload_hash({"a": 1, "b": 2})

          event = build_event(
              event_type="TEST",
              producer="CORE",
              consumer="IA",
              contract_name="TEST_CONTRACT_v1",
              contract_version="1",
              payload={"ok": True},
              event_id="evt-test-0001",
              correlation_id="corr-test-0001",
          )
          validate_event(event)
          ack = build_ack(event=event, receiver="IA", ack_status="ACCEPTED")
          validate_ack(ack, event=event)

          modified = dict(event)
          modified["payload"] = {"ok": False}
          try:
              validate_event(modified)
          except M2MContractError:
              pass
          else:
              raise AssertionError("modified payload must fail closed")

          assert [retry_offset_seconds(i) for i in range(1, 7)] == [0, 300, 900, 1800, 3600, 5400]
          print("M2M MASTER CONTRACT PASS")
          PY
