name: Private WEB account lifecycle
on:
  pull_request:
  push:
    branches: [feat/account-management-20261017]
permissions:
  contents: read
jobs:
  account-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install fastapi bcrypt PyJWT motor email-validator httpx
      - run: python -m unittest discover -s tests -p test_web_account_lifecycle.py -v
        working-directory: backend
