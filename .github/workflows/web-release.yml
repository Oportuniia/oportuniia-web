name: WEB release verification
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/web-release.yml'
permissions:
  contents: read
jobs:
  accounts-and-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-private.txt pytest pytest-asyncio pytest-xdist mongomock httpx
      - run: python -m compileall -q backend
      - run: python -m pytest backend/tests/test_web_identity.py backend/tests/test_web_services.py backend/tests/test_investor_access.py backend/tests/test_private_area_engine.py backend/tests/test_free_text_query.py -q
        env:
          PYTHONPATH: backend:backend/tests
      - name: Validate private browser scripts
        run: |
          for file in frontend/public/private/*.js; do node --check "$file"; done
