      - "backend/tests/test_mi_offer_expiry_worker.py"
      - "backend/tests/test_mi_offer_prefill.py"
      - "backend/tests/test_mi_offer_deadlines.py"
      - "frontend/public/preparar-oferta.html"
      - "backend/tests/check_offer_portal.py"
      - "backend/tests/check_escrow_copy.py"
      - "docs/MASTER_B2B_ESCROW_API_PAYMENT_ARCHITECTURE_20261003.md"
      - "frontend/public/como-funciona.html"
      - "backend/mi_subscription_bridge.py"
      - "backend/tests/test_mi_ocr.py"
      - "backend/tests/test_mi_subscription_bridge.py"
      - "backend/mi_premium_service.py"
      - "backend/mi_private_upload.py"
      - "backend/mi_rate_limit.py"
      - "backend/mi_private_download.py"
      - "backend/tests/test_mi_private_download.py"
      - "backend/tests/check_private_portal.py"
      - "frontend/public/mi-oportuniia.html"
      - "backend/tests/test_mi_rate_limit.py"
      - "backend/tests/test_mi_private_upload.py"
      - "backend/tests/test_mi_premium_service.py"
      - "backend/tests/test_mi_private_area.py"
      - "backend/tests/test_mi_pdf_organizer.py"
      - "backend/tests/test_personal_user_registry.py"
      - "backend/tests/test_mi_auth.py"
      - "backend/tests/test_personal_document_storage.py"
      - ".github/workflows/mi-oportuniia-privacy.yml"
  workflow_dispatch:
jobs:
  privacy-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local OCR runtime
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng
      - name: Install privacy-test dependencies
        run: python -m pip install pytest pytest-asyncio pytest-xdist pymongo boto3 bcrypt fastapi httpx PyMuPDF clamd pytesseract Pillow reportlab pypdf
      - name: Compile private area Python modules
        run: python -m compileall -q backend/mi_auth.py backend/mi_role_boundaries.py backend/mi_collaborator_policy.py backend/mi_referral_campaign.py backend/mi_collaborator_portfolio.py backend/mi_corporate_mail.py backend/mi_mail_templates.py backend/mi_private_area.py backend/mi_private_upload.py backend/mi_premium_service.py backend/mi_pdf_organizer.py backend/mi_rate_limit.py backend/mi_private_download.py backend/mi_ocr.py backend/mi_subscription_bridge.py backend/mi_offer_prefill.py backend/mi_offer_deadlines.py backend/mi_payment_rails.py backend/mi_offer_expiry_worker.py backend/mi_document_notifications.py backend/mi_notification_outbox.py backend/mi_notification_center.py backend/mi_notification_mock_delivery.py backend/mi_notification_scheduler.py backend/mi_payroll_notifications.py backend/mi_personalized_secretary.py backend/mi_secretary_proposals.py backend/mi_personal_calendar.py backend/mi_notification_validation.py backend/mi_offer_pdf.py backend/personal_document_storage.py
      - name: Validate portal JavaScript and contract wiring
        run: python backend/tests/check_private_portal.py
      - name: Validate premium offer page JavaScript
        run: python backend/tests/check_offer_portal.py
      - name: Validate escrow explanatory and contract wording
        run: python backend/tests/check_escrow_copy.py
      - name: Run isolated registry and storage security tests
        env:
          PYTHONPATH: backend
        run: >-
          python -m pytest -q
          backend/tests/test_personal_user_registry.py
          backend/tests/test_mi_auth.py
          backend/tests/test_mi_role_boundaries.py
          backend/tests/test_mi_collaborator_policy.py
          backend/tests/test_mi_referral_campaign.py
          backend/tests/test_mi_collaborator_portfolio.py
          backend/tests/test_mi_corporate_mail.py
          backend/tests/test_mi_mail_templates.py
          backend/tests/test_personal_document_storage.py
          backend/tests/test_mi_private_area.py
          backend/tests/test_mi_pdf_organizer.py
          backend/tests/test_mi_premium_service.py
          backend/tests/test_mi_private_upload.py
          backend/tests/test_mi_rate_limit.py
          backend/tests/test_mi_private_download.py
          backend/tests/test_mi_ocr.py
          backend/tests/test_mi_subscription_bridge.py
          backend/tests/test_mi_offer_prefill.py
          backend/tests/test_mi_offer_pdf.py
          backend/tests/test_mi_offer_deadlines.py
          backend/tests/test_mi_payment_rails.py
          backend/tests/test_mi_offer_expiry_worker.py
          backend/tests/test_mi_document_notifications.py
          backend/tests/test_mi_notification_scheduler.py
          backend/tests/test_mi_payroll_notifications.py
          backend/tests/test_mi_personalized_secretary.py
          backend/tests/test_mi_secretary_proposals.py
          backend/tests/test_mi_personal_calendar.py
          backend/tests/test_mi_notification_outbox.py
          backend/tests/test_mi_notification_center.py
          backend/tests/test_mi_notification_mock_delivery.py
          backend/tests/test_mi_notification_validation.py
